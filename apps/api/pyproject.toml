[project]
name = "weeklyrun-api"
version = "0.1.0"
description = "WeeklyRun - AI Meeting Orchestration Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.17.2",
    "pydantic-settings>=2.12.0",
    "asyncpg>=0.30.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "redis>=5.0.0",
    "structlog>=25.0.0",
    "aiofiles>=24.1.0",
    # AI & STT
    "openai>=1.60.0",
    "elevenlabs>=1.20.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "markdown>=3.7",
]

[dependency-groups]
dev = [
    "ruff>=0.11.12",
    "poethepoet>=0.35.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
]

[tool.uv]
managed = true

[tool.poe.tasks]
dev = "fastapi dev src/main.py --port 8000"
start = "fastapi run src/main.py --port 8000"

# Database
migrate = "alembic upgrade head"
"migrate:create" = "alembic revision --autogenerate -m"
"migrate:down" = "alembic downgrade -1"
seed = "python -m scripts.seed_data"

# Linting & Formatting
lint = "ruff check ."
"lint:fix" = "ruff check --fix ."
format = "ruff format ."
"format:check" = "ruff format --check ."

# Type checking
typecheck = "mypy src"

# Testing
test = "pytest tests/ -v"
"test:cov" = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80"

# OpenAPI
"gen:openapi" = "python scripts/gen_openapi.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "redis.asyncio.*", "elevenlabs.*", "aiofiles.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
